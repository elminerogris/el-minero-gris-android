name: Compilar APK El Minero Gris

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Calcular versión automática
        id: ver
        run: |
          CODE=$((10 + ${{ github.run_number }}))
          NAME="1.${{ github.run_number }}"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "{\"version_code\": $CODE, \"version_name\": \"$NAME\"}" > version.json

      - name: Decodificar Keystore de firma fija
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Reparar formato PNG del icono
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          rm -f app/src/main/res/mipmap-xxxhdpi/ic_launsdfsscher.png
          convert app/src/main/res/mipmap-xxxhdpi/ic_launcher.png PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK y Bundle AAB Release firmados
        env:
          AUTO_VERSION_CODE: ${{ steps.ver.outputs.code }}
          AUTO_VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          gradle bundleRelease

      - name: Renombrar artefactos de lanzamiento
        run: |
          cp app/build/outputs/apk/release/app-release.apk ElMineroGris.apk
          cp app/build/outputs/bundle/release/app-release.aab ElMineroGris.aab
          cp ElMineroGris.apk ElMineroGris-Agente.apk

      - name: Publicar en GitHub Releases (APK + AAB Google Play + version.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: El Minero Gris - App Android
          files: |
            ElMineroGris.apk
            ElMineroGris.aab
            ElMineroGris-Agente.apk
            version.json
