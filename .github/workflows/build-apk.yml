name: Compilar APK El Minero Gris

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ElMineroGris-Agente.apk

      - name: Publicar en GitHub Releases (Enlace Directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: El Minero Gris - Agente Android
          files: ElMineroGris-Agente.apk
