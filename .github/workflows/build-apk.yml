name: Compilar APK El Minero Gris

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decodificar Keystore de firma fija
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Compilar APK Release firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ElMineroGris-Agente.apk

      - name: Publicar en GitHub Releases (Enlace Directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: El Minero Gris - Agente Android
          files: ElMineroGris-Agente.apk
